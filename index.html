<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SG TripCards">
    
    <!-- Android Chrome -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#667eea">
    
    <!-- Disable phone number detection -->
    <meta name="format-detection" content="telephone=no">
    
    <title>SG TripCards</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>🇸🇬 SG TripCards</h1>
        <div class="poi-count"><span id="poiCount">0</span> Places</div>
    </header>

    <!-- Progress Bar -->
    <div class="progress-bar-container">
        <div class="progress-info">
            <span class="progress-label">📊 My Journey</span>
            <span class="progress-stats">
                <span class="progress-stat"><span class="stat-dot visited-dot"></span><span id="visitedCount">0</span> Visited</span>
                <span class="progress-stat"><span class="stat-dot planned-dot"></span><span id="plannedCount">0</span> To Visit</span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </span>
        </div>
        <div class="progress-track">
            <div class="progress-fill visited-segment" id="visitedBar"></div>
            <div class="progress-fill planned-segment" id="plannedBar"></div>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="search-bar-container">
        <input type="text" id="searchInput" placeholder="🔍 Search places in Singapore..." autocomplete="off">
        <div class="search-results" id="searchResults"></div>
    </div>

    <!-- 地图样式选择器 -->
    <div class="map-style-selector">
        <button class="style-toggle-btn" id="styleToggleBtn">🗺️</button>
        <div class="style-menu" id="styleMenu">
            <div class="style-option" data-style="voyager">
                <span class="style-preview voyager-preview"></span>
                <span class="style-name">Voyager</span>
            </div>
            <div class="style-option" data-style="positron">
                <span class="style-preview positron-preview"></span>
                <span class="style-name">Light</span>
            </div>
            <div class="style-option" data-style="dark">
                <span class="style-preview dark-preview"></span>
                <span class="style-name">Dark</span>
            </div>
            <div class="style-option" data-style="osm">
                <span class="style-preview osm-preview"></span>
                <span class="style-name">Standard</span>
            </div>
            <div class="style-option" data-style="satellite">
                <span class="style-preview satellite-preview"></span>
                <span class="style-name">Satellite</span>
            </div>
        </div>
    </div>

    <!-- 地图容器 -->
    <div id="map"></div>

    <!-- Emotion Color Bar -->
    <div class="emotion-bar">
        <div class="emotion-card" data-emotion="vibrant" style="background: linear-gradient(135deg, #F6C667 0%, #f8d48f 100%);">
            <span class="emotion-label">Vibrant</span>
        </div>
        <div class="emotion-card" data-emotion="romantic" style="background: linear-gradient(135deg, #E57373 0%, #ef9a9a 100%);">
            <span class="emotion-label">Romantic</span>
        </div>
        <div class="emotion-card" data-emotion="adventurous" style="background: linear-gradient(135deg, #6CB5F5 0%, #90caf9 100%);">
            <span class="emotion-label">Adventure</span>
        </div>
        <div class="emotion-card" data-emotion="creative" style="background: linear-gradient(135deg, #C26EF1 0%, #ce93d8 100%);">
            <span class="emotion-label">Creative</span>
        </div>
        <div class="emotion-card" data-emotion="nostalgic" style="background: linear-gradient(135deg, #A8875C 0%, #bcaa8c 100%);">
            <span class="emotion-label">Nostalgic</span>
        </div>
        <div class="emotion-card" data-emotion="calm" style="background: linear-gradient(135deg, #4FB0AE 0%, #80cbc4 100%);">
            <span class="emotion-label">Calm</span>
        </div>
    </div>

    <!-- Recenter Button -->
    <button class="recenter-btn" id="recenterBtn" title="Recenter Map">
        <span class="recenter-icon">⊕</span>
    </button>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <img src="SG60.png" alt="SG60" class="loading-sg60">
            <div class="loading-logo">🇸🇬</div>
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading SG TripCards...</div>
        </div>
    </div>

    <!-- Category Color Bar -->
    <div class="category-bar">
        <div class="category-card active" data-category="all" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
            <span class="category-label">All</span>
        </div>
        <div class="category-card" data-category="urban_iconic" style="background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);">
            <span class="category-label">Urban</span>
        </div>
        <div class="category-card" data-category="creative_scene" style="background: linear-gradient(135deg, #E64980 0%, #C23A6A 100%);">
            <span class="category-label">Arts</span>
        </div>
        <div class="category-card" data-category="cultural_heritage" style="background: linear-gradient(135deg, #D4A574 0%, #B8915F 100%);">
            <span class="category-label">Heritage</span>
        </div>
        <div class="category-card" data-category="serene_nature" style="background: linear-gradient(135deg, #51CF66 0%, #40B854 100%);">
            <span class="category-label">Nature</span>
        </div>
        <div class="category-card" data-category="social_vibe" style="background: linear-gradient(135deg, #FF6B6B 0%, #EE5A5A 100%);">
            <span class="category-label">Social</span>
        </div>
        <div class="category-card" data-category="hidden_gems" style="background: linear-gradient(135deg, #9775FA 0%, #7C5FD8 100%);">
            <span class="category-label">Hidden</span>
        </div>
    </div>

    <!-- Color Mode Slider -->
    <div class="color-mode-slider">
        <div class="slider-track">
            <div class="slider-option" data-mode="emotion">
                <span class="slider-icon">🎨</span>
                <span class="slider-label">Emotion</span>
            </div>
            <div class="slider-option" data-mode="category">
                <span class="slider-icon">🏷️</span>
                <span class="slider-label">Category</span>
            </div>
            <div class="slider-indicator" id="sliderIndicator"></div>
        </div>
    </div>

    <!-- POI Detail Panel -->
    <div class="poi-detail" id="poiDetail">
        <div class="poi-detail-content">
            <button class="close-btn" id="closeDetail">&times;</button>
            <h2 id="poiName"></h2>
            <div class="poi-category" id="poiCategory"></div>
            <div class="poi-emotion" id="poiEmotion"></div>
            <p id="poiDescription"></p>
            
            <!-- Visit Status -->
            <div class="status-selector">
                <div class="status-label">Mark as:</div>
                <div class="status-buttons">
                    <button class="status-btn" data-status="visited">
                        <span class="status-icon">✕</span>
                        <span class="status-text">Visited</span>
                    </button>
                    <button class="status-btn" data-status="planned">
                        <span class="status-icon">+</span>
                        <span class="status-text">To Visit</span>
                    </button>
                    <button class="status-btn" data-status="unvisited">
                        <span class="status-icon">📍</span>
                        <span class="status-text">Unvisited</span>
                    </button>
                </div>
            </div>
            
            <button class="navigate-btn" id="navigateBtn">
                📍 Navigate Here
            </button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>
    
    <script src="app.js"></script>
</body>
</html>
