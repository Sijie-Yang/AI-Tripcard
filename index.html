<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Singapore Map">
    
    <!-- Android Chrome -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#667eea">
    
    <!-- Disable phone number detection -->
    <meta name="format-detection" content="telephone=no">
    
    <title>Singapore Travel Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>🇸🇬 Singapore Travel</h1>
        <div class="poi-count"><span id="poiCount">0</span> Places</div>
    </header>

    <!-- 地图样式选择器 -->
    <div class="map-style-selector">
        <button class="style-toggle-btn" id="styleToggleBtn">🗺️</button>
        <div class="style-menu" id="styleMenu">
            <div class="style-option" data-style="voyager">
                <span class="style-preview voyager-preview"></span>
                <span class="style-name">Voyager</span>
            </div>
            <div class="style-option" data-style="positron">
                <span class="style-preview positron-preview"></span>
                <span class="style-name">Light</span>
            </div>
            <div class="style-option" data-style="dark">
                <span class="style-preview dark-preview"></span>
                <span class="style-name">Dark</span>
            </div>
            <div class="style-option" data-style="osm">
                <span class="style-preview osm-preview"></span>
                <span class="style-name">Standard</span>
            </div>
            <div class="style-option" data-style="satellite">
                <span class="style-preview satellite-preview"></span>
                <span class="style-name">Satellite</span>
            </div>
        </div>
    </div>

    <!-- 地图容器 -->
    <div id="map"></div>

    <!-- Color Legend -->
    <div class="color-legend">
        <div class="legend-title">Emotions</div>
        <div class="legend-items">
            <div class="legend-item">
                <span class="legend-color" style="background-color: #F6C667;"></span>
                <span class="legend-label">Vibrant</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background-color: #E57373;"></span>
                <span class="legend-label">Romantic</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background-color: #6CB5F5;"></span>
                <span class="legend-label">Adventure</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background-color: #C26EF1;"></span>
                <span class="legend-label">Creative</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background-color: #A8875C;"></span>
                <span class="legend-label">Nostalgic</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background-color: #4FB0AE;"></span>
                <span class="legend-label">Calm</span>
            </div>
        </div>
    </div>

    <!-- Progress Stats Card -->
    <div class="stats-card">
        <div class="stats-header">
            <span class="stats-icon">📊</span>
            <span class="stats-title">My Journey</span>
        </div>
        <div class="stats-body">
            <div class="stat-item">
                <div class="stat-value" id="visitedCount">0</div>
                <div class="stat-label">Visited</div>
                <div class="stat-bar">
                    <div class="stat-fill visited-fill" id="visitedBar"></div>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="plannedCount">0</div>
                <div class="stat-label">To Visit</div>
                <div class="stat-bar">
                    <div class="stat-fill planned-fill" id="plannedBar"></div>
                </div>
            </div>
        </div>
        <div class="stats-footer">
            <span id="progressPercent">0%</span> Complete
        </div>
    </div>

    <!-- Search Box -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Search places..." autocomplete="off">
        <div class="search-results" id="searchResults"></div>
    </div>

    <!-- Recenter Button -->
    <button class="recenter-btn" id="recenterBtn" title="Recenter Map">
        <span class="recenter-icon">⊕</span>
    </button>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <div class="loading-logo">🇸🇬</div>
            <div class="loading-spinner"></div>
            <div class="loading-text">Discovering Singapore...</div>
        </div>
    </div>

    <!-- Filter Buttons -->
    <div class="filter-container">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="urban_iconic">Urban</button>
        <button class="filter-btn" data-category="creative_scene">Arts</button>
        <button class="filter-btn" data-category="cultural_heritage">Heritage</button>
        <button class="filter-btn" data-category="serene_nature">Nature</button>
        <button class="filter-btn" data-category="social_vibe">Social</button>
        <button class="filter-btn" data-category="hidden_gems">Hidden Gems</button>
    </div>

    <!-- POI Detail Panel -->
    <div class="poi-detail" id="poiDetail">
        <div class="poi-detail-content">
            <button class="close-btn" id="closeDetail">&times;</button>
            <h2 id="poiName"></h2>
            <div class="poi-category" id="poiCategory"></div>
            <div class="poi-emotion" id="poiEmotion"></div>
            <p id="poiDescription"></p>
            
            <!-- Visit Status -->
            <div class="status-selector">
                <div class="status-label">Mark as:</div>
                <div class="status-buttons">
                    <button class="status-btn" data-status="visited">
                        <span class="status-icon">✕</span>
                        <span class="status-text">Visited</span>
                    </button>
                    <button class="status-btn" data-status="planned">
                        <span class="status-icon">+</span>
                        <span class="status-text">To Visit</span>
                    </button>
                    <button class="status-btn" data-status="unvisited">
                        <span class="status-icon">📍</span>
                        <span class="status-text">Unvisited</span>
                    </button>
                </div>
            </div>
            
            <button class="navigate-btn" id="navigateBtn">
                📍 Navigate Here
            </button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>
    
    <script src="app.js"></script>
</body>
</html>
